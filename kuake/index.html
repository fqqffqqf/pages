            min-height: 0;

        }
        .item {

            border-bottom:1px solid #f2f2f2;
            cursor: pointer;
            user-select:none;
        }
        .item:active{
            background:#f0f0f0;
        }
        .item.highlight {
            background: #fff280;
        }
        .toast{
            position:fixed;
            bottom:30px;
            left:50%;
            transform:translateX(-50%);
            background:#333;
            color:#fff;
            padding:8px 16px;
            border-radius:6px;
            font-size:14px;
            display:none;
            z-index:999;
        }
    </style>

// 把你的原始数据转换成程序需要的 [{name,link}] 数组
let data = [];
for(const category in rawData){
    const list = rawData[category];
    list.forEach(itemArr=>{
        // 安全校验
        if(!itemArr || !Array.isArray(itemArr) || itemArr.length ===0) return;
        const str = itemArr[0];
        if(typeof str !== 'string' || str.trim() === '') return;

        // 同时支持英文冒号 : 和中文冒号 ：，取最先出现的那个位置
        const idxEn = str.indexOf(':');
        const idxCn = str.indexOf('：');
        // 收集所有存在的冒号下标
        const indexes = [];
        if(idxEn !== -1) indexes.push(idxEn);
        if(idxCn !== -1) indexes.push(idxCn);
        if(indexes.length === 0) return;
        // 取第一个冒号
        const splitIndex = Math.min(...indexes);

        const name = str.substring(0, splitIndex).trim();
        const link = str.substring(splitIndex+1).trim();
        // 名字和链接都不为空才加入
        if(name && link){
            data.push({name, link});
        }
    })
}

const leftPanel = document.getElementById('leftPanel');
const rightPanel = document.getElementById('rightPanel');
const searchInput = document.getElementById('searchInput');
const refreshBtn = document.getElementById('refreshBtn');
const toastEl = document.getElementById('toast');

let randomCache = getRandom20();
let autoTimer = null;
const FOUR_HOUR = 4 * 60 * 60 * 1000;

// Toast提示
function showToast(text){
    toastEl.innerText = text;
    toastEl.style.display = "block";
    setTimeout(()=>toastEl.style.display="none", 1500);
}

// 复制容错
async function copyText(text){
    try{
        await navigator.clipboard.writeText(text);
        return true;
    }catch(err){
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'absolute';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
    }
}

// 渲染单项item：单击复制链接，双击复制+打开夸克
function createItemEl(item, highlight=false){
    const div = document.createElement('div');
    div.className = "item" + (highlight ? " highlight" : "");
    div.innerText = item.name;

    let clickTimer = null;
    const CLICK_DELAY = 300;

    div.addEventListener('click', () => {
        clickTimer = setTimeout(async ()=>{
            await copyText(item.link);
            showToast("链接已复制");
        }, CLICK_DELAY);
    })

    div.addEventListener('dblclick', async (e) => {
        e.preventDefault();
        clearTimeout(clickTimer);
        await copyText(item.link);
        showToast("已复制，打开夸克");
        window.location.href = `quark://open?url=${encodeURIComponent(item.link)}`;
    })
    return div;
}

// 渲染左侧：全部剧名固定不变
function renderLeft(){
    leftPanel.innerHTML = "";
    data.forEach(item=>{
        leftPanel.appendChild(createItemEl(item));
    })
}

// 获取随机20个
function getRandom20(){
    const arr = [...data];
    arr.sort(()=> Math.random() - 0.5);
    return arr.slice(0,20);
}

// 渲染右侧面板
function renderRight(keyword=""){
    rightPanel.innerHTML = "";
    const kw = keyword.trim().toLowerCase();
    if(kw){
        // 搜索模式：显示匹配项并高亮
        const matched = data.filter(item=> item.name.toLowerCase().includes(kw));
        matched.forEach(item=>{
            rightPanel.appendChild(createItemEl(item, true));
        })
    }else{
        // 无搜索词：展示随机20
        randomCache.forEach(item=>{
            rightPanel.appendChild(createItemEl(item));
        })
    }
}

// 启动自动4小时定时器
function startAutoTimer(){
    clearInterval(autoTimer);
    autoTimer = setInterval(()=>{
        randomCache = getRandom20();
        if(!searchInput.value.trim()){
            renderRight();
        }
    }, FOUR_HOUR);
}

// 换一批按钮：清空搜索框，重新随机，重置4小时计时
refreshBtn.onclick = ()=>{
    // 清空搜索输入框
    searchInput.value = "";
    randomCache = getRandom20();
    startAutoTimer(); // 重新计时
    renderRight(""); // 强制刷新右侧随机列表
    showToast("已换一批");
}

// 搜索输入监听
searchInput.addEventListener('input', (e)=>{
    renderRight(e.target.value);
})

// 初始化
startAutoTimer();
renderLeft();
renderRight();
</script>
